[project]
name = "pehchana"
version = "0.1.0"
description = "Pehchana Kaun? backend: phone-line Turing test for Indian voice AI"
authors = [
    { name = "OfficialAbhinavSingh", email = "abhinav.25bcs10345@sst.scaler.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2.0.0",
    "fastapi>=0.158.1",
    "httpx>=0.28.1",
    "plivo>=4.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
pk = "pehchana.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "src"
packages = ["pehchana"]

[[tool.mypy.overrides]]
module = ["plivo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
