name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Production is Postgres, so the migration tests run on it too (tests/test_migrations.py).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pk
          POSTGRES_PASSWORD: pk
          POSTGRES_DB: pk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pk" --health-interval 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://pk:pk@localhost:5432/pk
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
