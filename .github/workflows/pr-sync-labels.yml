name: Sync PR labels and milestone from its issue

# Every PR here closes exactly one issue ("Closes #N" per CONTRIBUTING's workflow
# steps). The issue already carries the right workstream/type/priority labels and
# milestone; this copies them onto the PR so triage doesn't happen twice.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = [...new Set([...body.matchAll(re)].map(m => Number(m[1])))];

            if (issueNumbers.length === 0) {
              core.info("no Closes #N in the PR body, nothing to sync");
              return;
            }

            const labels = new Set();
            let milestone = null;
            for (const number of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                }));
              } catch (e) {
                core.warning(`#${number}: ${e.message}`);
                continue;
              }
              for (const l of issue.labels) labels.add(typeof l === "string" ? l : l.name);
              if (!milestone && issue.milestone) milestone = issue.milestone.number;
            }

            const prNumber = context.payload.pull_request.number;

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [...labels],
              });
            }

            if (milestone && !context.payload.pull_request.milestone) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                milestone,
              });
            }

            core.info(`synced labels [${[...labels].join(", ")}] and milestone ${milestone} from #${issueNumbers.join(", #")}`);
